name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VERSION: v1

permissions: {}

concurrency:
  group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static_analysis_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        persona: pedantic
        advanced-security: false # Fail the GitHub action if Zizmor has findings
